plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'lol.bai.explosion' version "${explosion_version}"
	id 'eclipse'
}

eclipse {
	project {
		name = rootProject.name
	}
}

version = project.mod_version
group = project.maven_group

configurations {
	voxyRuntimeOnly
	dhRuntimeOnly

	configure([modLocalRuntime, voxyRuntimeOnly, dhRuntimeOnly]) {
		exclude group: "net.fabricmc.fabric-api"
	}
}

repositories {
	maven {
		name = "badasintended/explosion"
		url = "https://maven2.bai.lol"
		content { includeGroup "lol.bai.explosion" }
	}
	maven {
		name = "DevAuth"
		url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
	maven {
		name = "Xander"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modLocalRuntime "me.djtheredstoner:DevAuth-fabric:${project.devauth_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "maven.modrinth:remember-my-txt:${project.remember_version}"
	modLocalRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	modLocalRuntime "maven.modrinth:f5-split:${project.f5_split_version}"
	modLocalRuntime "maven.modrinth:freecam:${project.freecam_version}"

	voxyRuntimeOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
	voxyRuntimeOnly explosion.fabric("maven.modrinth:voxy:${project.voxy_version}")
	dhRuntimeOnly "maven.modrinth:distanthorizons:${project.dh_version}"
}

loom {
	runs {
		client {
			configName = "Minecraft Vanilla"
			vmArgs "-Ddevauth.enabled=true"
			client()
		}

		voxy {
			configName = "Minecraft Voxy"
			vmArgs "-Ddevauth.enabled=true"
			client()
			property("fabric.addMods", "${-> configurations.voxyRuntimeOnly.asPath}")
		}

		dh {
			configName = "Minecraft Distant Horizons"
			vmArgs "-Ddevauth.enabled=true"
			client()
			property("fabric.addMods", "${-> configurations.dhRuntimeOnly.asPath}")
		}

		remove server
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
